upstream saas_api { server saas-api:3000; }
upstream saas_admin { server saas-admin:80; }
upstream saas_viewer { server saas-viewer:80; }

server {
  listen 80;
  client_max_body_size 200m;
  # 保留浏览器地址栏端口（避免 /admin → Location 丢 :18700）
  absolute_redirect off;

  # 入口：根路径无业务页，跳管理端；消除裸开 :18700 的 index 404
  location = / {
    return 302 /admin/;
  }

  # 浏览器默认请求；一期无站标文件，204 消控制台 404 噪音
  location = /favicon.ico {
    access_log off;
    return 204;
  }

  location /health {
    proxy_pass http://saas_api/health;
  }

  location /api/ {
    proxy_pass http://saas_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://saas_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /public/ {
    proxy_pass http://saas_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /platform/ {
    proxy_pass http://saas_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    proxy_pass http://saas_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /admin/ {
    proxy_pass http://saas_admin;
    proxy_set_header Host $http_host;
  }

  location /v/ {
    proxy_pass http://saas_viewer;
    proxy_set_header Host $http_host;
  }
}
